name: Build IPA with nxnative

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'NSP/XCI Direct URL (GoFile 등 직링크 권장, 구글 드라이브는 막힐 수 있음)'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Free up disk space (Critical for nxnative)
        run: |
          echo "nxnative 빌드 요구사항(게임용량x2 + 10GB)을 위해 여유 공간을 강제 확보합니다..."
          sudo rm -rf /Applications/Xcode_14*.app
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mac Environment
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'" gdown --break-system-packages

      - name: Create keys file
        run: |
          mkdir -p ~/keys
          echo "${{ secrets.PROD_KEYS }}" > ~/keys/prod.keys

      - name: Download Game File
        run: |
          mkdir -p ~/Games/MyGame
          cd ~/Games/MyGame
          
          # 구글 드라이브 링크면 gdown, 일반 링크면 curl 사용
          if [[ "${{ github.event.inputs.game_url }}" == *"drive.google.com"* ]]; then
            python3 -m gdown "${{ github.event.inputs.game_url }}" --fuzzy
          else
            curl -L -O "${{ github.event.inputs.game_url }}"
          fi
          
          # 가짜 HTML(다운로드 차단) 방지: 다운로드된 파일이 100MB 이하인지 검사
          FILE_SIZE=$(stat -f%z * | head -n 1)
          if [ "$FILE_SIZE" -lt 100000000 ]; then
            echo "❌ 오류: 다운로드된 파일이 너무 작습니다 ($FILE_SIZE bytes)."
            echo "구글 드라이브가 GitHub 서버의 다운로드를 차단하고 가짜 HTML을 보냈습니다."
            echo "해결책: 게임 파일을 GoFile(gofile.io) 등에 업로드하고 그 직링크를 사용하세요."
            exit 1
          fi
          echo "✅ 게임 다운로드 성공! 실제 파일 크기: $FILE_SIZE bytes"

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/MyGame -k ~/keys/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: ~/Games/MyGame/*.ipa
