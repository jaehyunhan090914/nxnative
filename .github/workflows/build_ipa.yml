name: Build IPA

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct download URL for NSP/XCI game file'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mac Environment
        run: |
          brew install xcodegen zstd spirv-cross glslang
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Create keys file
        run: |
          mkdir -p ~/keys
          echo "${{ secrets.PROD_KEYS }}" > ~/keys/prod.keys

      - name: Download Game File
        run: |
          mkdir -p ~/Games/MyGame
          curl -L "${{ github.event.inputs.game_url }}" -o ~/Games/MyGame/game.nsp

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/MyGame -k ~/keys/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: ~/Games/MyGame/*.ipa
