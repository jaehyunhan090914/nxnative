name: Build IPA with nxnative

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct download URL or Google Drive URL for NSP/XCI/NSZ game file'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mac Environment
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'" gdown --break-system-packages

      - name: Create keys file
        run: |
          mkdir -p ~/keys
          echo "${{ secrets.PROD_KEYS }}" > ~/keys/prod.keys

      - name: Download Game File
        run: |
          mkdir -p ~/Games/MyGame
          python3 -m gdown "${{ github.event.inputs.game_url }}" -O ~/Games/MyGame/game.nsp --fuzzy || curl -L "${{ github.event.inputs.game_url }}" -o ~/Games/MyGame/game.nsp

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/MyGame -k ~/keys/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: ~/Games/MyGame/*.ipa
