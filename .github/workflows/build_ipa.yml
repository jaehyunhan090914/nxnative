name: Build IPA with nxnative

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Google Drive URL for NSP/XCI game file'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Free up disk space (Critical for nxnative)
        run: |
          echo "nxnative 빌드 요구사항(게임용량x2 + 10GB)을 위해 여유 공간을 강제 확보합니다..."
          sudo rm -rf /Applications/Xcode_14*.app
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mac Environment
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'" --break-system-packages
          # gdown 대신 gdrive-downloader 라이브러리 사용
          python3 -m pip install gdrive-downloader --break-system-packages

      - name: Create keys file
        run: |
          mkdir -p ~/keys
          echo "${{ secrets.PROD_KEYS }}" > ~/keys/prod.keys

      - name: Download Game File
        run: |
          mkdir -p ~/Games/MyGame
          cd ~/Games/MyGame
          
          # 구글 드라이브 ID 추출
          FILE_ID=$(echo "${{ github.event.inputs.game_url }}" | sed -n 's/.*id=\([^&]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then
            FILE_ID=$(echo "${{ github.event.inputs.game_url }}" | sed -n 's/.*\/d\/\([^\/]*\).*/\1/p')
          fi
          
          echo "추출된 파일 ID: $FILE_ID"
          
          # 파이썬 스크립트로 대용량 파일 다운로드 (바이러스 경고 우회)
          cat << 'EOF' > download.py
          import sys
          from google_drive_downloader import GoogleDriveDownloader as gdd
          file_id = sys.argv[1]
          gdd.download_file_from_google_drive(file_id=file_id, dest_path='./game.xci', overwrite=True)
          EOF
          
          python3 download.py "$FILE_ID"

          # 가짜 HTML(다운로드 차단) 방지: 다운로드된 파일이 100MB 이하인지 검사
          FILE_SIZE=$(stat -f%z game.xci)
          if [ "$FILE_SIZE" -lt 100000000 ]; then
            echo "❌ 오류: 다운로드된 파일이 너무 작습니다 ($FILE_SIZE bytes)."
            echo "구글 드라이브가 다운로드 한도를 차단했거나 파일이 텍스트입니다."
            exit 1
          fi
          echo "✅ 게임 다운로드 성공! 실제 파일 크기: $FILE_SIZE bytes"

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/MyGame -k ~/keys/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: ~/Games/MyGame/*.ipa
