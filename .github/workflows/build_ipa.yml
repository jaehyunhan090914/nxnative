name: Build IPA with nxnative

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct download URL or Google Drive URL for NSP/XCI/NSZ game file'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mac Environment
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'" gdown --break-system-packages

      - name: Create keys file
        run: |
          mkdir -p ~/keys
          echo "${{ secrets.PROD_KEYS }}" > ~/keys/prod.keys

      - name: Download Game File
        run: |
          mkdir -p ~/Games/MyGame
          FILE_ID=$(echo "${{ github.event.inputs.game_url }}" | sed -n 's/.*id=\([^&]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then
            FILE_ID=$(echo "${{ github.event.inputs.game_url }}" | sed -n 's/.*\/d\/\([^\/]*\).*/\1/p')
          fi
          
          if [ -n "$FILE_ID" ]; then
            echo "Downloading Google Drive file ID: $FILE_ID"
            curl -c /tmp/cookies "https://drive.google.com/uc?export=download&id=${FILE_ID}" > /tmp/confirm.html
            CONFIRM=$(grep -o 'confirm=[^&"]*' /tmp/confirm.html | head -n 1)
            if [ -n "$CONFIRM" ]; then
              curl -Lb /tmp/cookies "https://drive.google.com/uc?export=download&${CONFIRM}&id=${FILE_ID}" -o ~/Games/MyGame/game.nsp
            else
              python3 -m gdown --id "$FILE_ID" -O ~/Games/MyGame/game.nsp --fuzzy || curl -L "${{ github.event.inputs.game_url }}" -o ~/Games/MyGame/game.nsp
            fi
          else
            curl -L "${{ github.event.inputs.game_url }}" -o ~/Games/MyGame/game.nsp
          fi

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/MyGame -k ~/keys/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: ~/Games/MyGame/*.ipa
